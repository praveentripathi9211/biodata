<!DOCTYPE html>
<html lang="en">

    <title>Biodata in HTML</title>

        }

            display: block;
            margin: 15px auto;

            border: 3px solid cyan;
        }

            border-bottom: 2px solid cyan;
            padding-bottom: 5px;
            margin-top: 20px;
            color: #00ddff;
        }

        ul{

        }

        li{
            margin: 8px 0;
        }

        a{
            color: #00ddff;
            text-decoration: none;
        }

        a:hover{
            text-decoration: underline;
        }

        p{
            text-align: center;
            margin-top: 20px;
            font-style: italic;
            color: #aaa;
        }
